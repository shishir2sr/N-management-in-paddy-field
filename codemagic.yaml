workflows:
  android-build:
    name: Android Build
    environment:
      flutter: stable
      # Was a bare sequence item directly under `environment:`, which is not a
      # valid key there — signing credentials were never actually loaded.
      groups:
        - keystore_reference
      android-sdk-components:
        - "build-tools;35.0.0"
        - "platforms;android-35"
        # Required now that defaultConfig declares ndk.abiFilters.
        - "ndk;28.2.13676358"
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Analyze
        script: |
          flutter analyze
      - name: Test
        script: |
          flutter test
      - name: Build AAB with Flutter
        script: |
          flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
